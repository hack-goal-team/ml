name: Deploy inference

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два деплоя подряд не должны грузить и перезапускать образ параллельно.
concurrency:
  group: deploy-inference
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Без зелёных тестов и сборки образа на VPS ничего не едет.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE: inference:${{ github.sha }}
      REMOTE_DIR: backend
    steps:
      # Без секретов ssh ждал бы ввода или падал невнятно — валимся сразу.
      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::repository secrets are not set:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/id_vps
            IdentitiesOnly yes
            ServerAliveInterval 30
            ConnectTimeout 20
            BatchMode yes
          EOF

      # Образ едет по SSH, как у бэкенда: реестр на VPS не нужен.
      - name: Upload image
        run: |
          set -o pipefail
          docker save "$IMAGE" | gzip | ssh vps 'gunzip | sudo -n docker load'

      # Прежний current — точка отката. Повторный прогон того же sha его
      # не трогает, иначе previous совпал бы с новым образом.
      - name: Tag previous
        run: |
          ssh vps "SHA=${{ github.sha }} bash -s" <<'EOF'
          set -euo pipefail
          old=$(sudo -n docker image inspect -f '{{.Id}}' inference:current 2>/dev/null || true)
          new=$(sudo -n docker image inspect -f '{{.Id}}' "inference:$SHA")
          if [ -n "$old" ] && [ "$old" != "$new" ]; then
            sudo -n docker tag inference:current inference:previous
          fi
          EOF

      # Стабильный тег, а не переменная в .env: деплой бэкенда переписывает
      # ~/backend/.env целиком.
      - name: Tag current
        run: |
          ssh vps "SHA=${{ github.sha }} bash -s" <<'EOF'
          set -euo pipefail
          sudo -n docker tag "inference:$SHA" inference:current
          EOF

      - name: Restart services
        run: |
          ssh vps "REMOTE_DIR=$REMOTE_DIR bash -s" <<'EOF'
          set -euo pipefail
          cd "$HOME/$REMOTE_DIR" 2>/dev/null || {
            echo "::notice::~/$REMOTE_DIR is missing: image loaded, nothing to restart"
            exit 0
          }
          all=$(sudo -n docker compose config --services) || {
            echo "::error::docker compose config failed in ~/$REMOTE_DIR"
            exit 1
          }
          # Все сервисы на образе inference:current: модель поломок и
          # 4-классовая. Сервисы и гранты добавляет бэкенд (HACK-136).
          services=$(grep -xE 'inference(-[a-z0-9]+)?' <<<"$all" || true)
          if [ -z "$services" ]; then
            echo "::notice::backend compose has no inference services yet (HACK-136): image loaded, not started"
            exit 0
          fi
          echo "services: $(tr '\n' ' ' <<<"$services")"

          # Прогрев окон за 3 дня — минуты; ждём healthy, а не running.
          wait_healthy() {
            local deadline=$((SECONDS + 900)) service id status
            for service in $services; do
              while :; do
                id=$(sudo -n docker compose ps -q "$service")
                status=$(sudo -n docker inspect -f '{{.State.Health.Status}}' "$id" 2>/dev/null || echo missing)
                echo "$service: $status"
                [ "$status" = healthy ] && break
                if [ "$status" = unhealthy ] || [ $SECONDS -ge $deadline ]; then
                  echo "::error::$service is not healthy ($status)"
                  sudo -n docker compose logs --tail 200 "$service" || true
                  return 1
                fi
                sleep 15
              done
            done
          }

          rollback() {
            if ! sudo -n docker image inspect inference:previous >/dev/null 2>&1; then
              echo "::error::no inference:previous image, nothing to roll back to"
              return 1
            fi
            echo "::error::new inference failed; restoring inference:previous"
            sudo -n docker tag inference:previous inference:current
            sudo -n docker compose up -d --no-deps --force-recreate $services
            wait_healthy
          }

          if ! sudo -n docker compose up -d --no-deps --force-recreate $services || ! wait_healthy; then
            rollback || true
            exit 1
          fi
          for service in $services; do
            sudo -n docker compose logs --tail 20 "$service"
          done
          EOF

      # После рестарта: старый образ уже не держит контейнер. Хранятся current,
      # previous для отката и образ до full-no2021 (образ 2.3 ГБ).
      - name: Prune old images
        run: |
          ssh vps "SHA=${{ github.sha }} bash -s" <<'EOF'
          set -euo pipefail
          sudo -n docker image ls inference --format '{{.CreatedAt}}\t{{.Tag}}' \
            | { grep -vP "\t(current|previous|$SHA|rollback-before-full-no2021)\$" || true; } | cut -f2 \
            | while read -r tag; do sudo -n docker image rm "inference:$tag" >/dev/null || true; done
          sudo -n docker image prune -f >/dev/null
          EOF
